server:
  port: ${SERVER_PORT:8101}

spring:
  application:
    name: order
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${DB_USER:nexus}
    password: ${DB_PASSWORD:nexus}
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: order-saga
      enable-auto-commit: false
      auto-offset-reset: earliest
    producer:
      acks: all
      properties:
        enable.idempotence: true
  mvc:
    problemdetails:
      enabled: true

nexus:
  order:
    step-timeout: PT30S
    max-step-attempts: 2
    max-compensation-attempts: 5
    sweep-batch-size: 100
    timeout-sweeper:
      enabled: true
      interval: PT1S
    topic-partitions: 12
    topic-replicas: 1
    fraud:
      target: ${FRAUD_GRPC_TARGET:localhost:9090}
      call-deadline: PT2S
      auto-run: true
      poll-interval: PT1S

logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
