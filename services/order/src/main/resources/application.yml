server:
  port: ${SERVER_PORT:8101}

spring:
  application:
    name: order
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${DB_USER:nexus}
    password: ${DB_PASSWORD:nexus}
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      observation-enabled: true   # continue the trace from the traceparent header
    consumer:
      group-id: order-saga
      enable-auto-commit: false
      auto-offset-reset: earliest
      properties:
        # A crashed instance's partitions move after 10 s instead of the 45 s default (ADR 0008).
        session.timeout.ms: 10000
        heartbeat.interval.ms: 3000
    producer:
      acks: all
      properties:
        enable.idempotence: true
  mvc:
    problemdetails:
      enabled: true

nexus:
  order:
    grpc-port: ${GRPC_PORT:9091}   # OrderService for the gateway (contracts/proto/nexus/order/v1)
    step-timeout: PT30S
    max-step-attempts: 2
    max-compensation-attempts: 5
    sweep-batch-size: 100
    timeout-sweeper:
      enabled: true
      interval: PT1S
      startup-grace: PT10S   # no timeouts until replies are being read (ADR 0008)
    topic-partitions: 12
    topic-replicas: 1
    fraud:
      target: ${FRAUD_GRPC_TARGET:localhost:9090}
      call-deadline: PT2S
      auto-run: true
      poll-interval: PT1S

logging:
  structured:
    format:
      console: ecs

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      # Off until a collector exists (Tempo is Phase 4); traceparent still propagates without export.
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${TRACING_EXPORT_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
