server:
  port: ${SERVER_PORT:8102}

spring:
  application:
    name: inventory
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory_db}
    username: ${DB_USER:nexus}
    password: ${DB_PASSWORD:nexus}
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      observation-enabled: true   # continue the trace from the traceparent header
    consumer:
      group-id: inventory-svc
      enable-auto-commit: false
      auto-offset-reset: earliest
      properties:
        # A crashed instance's partitions move after 10 s instead of the 45 s default (ADR 0008).
        session.timeout.ms: 10000
        heartbeat.interval.ms: 3000
    producer:
      acks: all
      properties:
        enable.idempotence: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Display-only cache: fail fast and fall back to Postgres rather than slow a reservation's eviction.
      timeout: 200ms
      connect-timeout: 200ms

nexus:
  inventory:
    reservation-ttl: PT10M
    expiry-sweep-batch-size: 100
    expiry-sweeper:
      enabled: true
      interval: PT10S
    topic-partitions: 12
    topic-replicas: 1
    stock-cache:
      enabled: ${STOCK_CACHE_ENABLED:true}
      ttl: PT5S

logging:
  structured:
    format:
      console: ecs

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      # Off until a collector exists (Tempo is Phase 4); traceparent still propagates without export.
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${TRACING_EXPORT_ENABLED:false}
  health:
    redis:
      enabled: false   # the cache is optional; Redis being down must not mark Inventory unhealthy
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
