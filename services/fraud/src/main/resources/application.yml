server:
  port: ${SERVER_PORT:8104}

spring:
  application:
    name: fraud
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fraud_db}
    username: ${DB_USER:nexus}
    password: ${DB_PASSWORD:nexus}
  flyway:
    locations: classpath:db/migration

nexus:
  fraud:
    grpc-port: ${GRPC_PORT:9090}
    max-amount-cents: 500000
    velocity-max-orders: 5
    velocity-window: PT10M

logging:
  structured:
    format:
      console: ecs

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      # Off until a collector exists (Tempo is Phase 4); traceparent still propagates without export.
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${TRACING_EXPORT_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
