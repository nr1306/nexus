server:
  port: ${SERVER_PORT:8103}

spring:
  application:
    name: payment
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DB_USER:nexus}
    password: ${DB_PASSWORD:nexus}
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: payment-svc
      enable-auto-commit: false
      auto-offset-reset: earliest
    producer:
      acks: all
      properties:
        enable.idempotence: true

nexus:
  payment:
    gateway: ${PAYMENT_GATEWAY:mock}
    mock-latency: PT0S
    topic-partitions: 12
    topic-replicas: 1

logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
